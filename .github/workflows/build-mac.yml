name: Build Desktop Installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  resolve-release:
    name: Resolve target Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Find target Release
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            let release

            if (context.eventName === 'push' && context.ref.startsWith('refs/tags/')) {
              const tag = context.ref.replace('refs/tags/', '')
              try {
                const response = await github.rest.repos.getReleaseByTag({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag,
                })
                release = response.data
              } catch (error) {
                if (error.status === 404) {
                  core.setFailed(`No published Release exists for tag ${tag}. Create the Release first, then rerun the workflow.`)
                  return
                }
                throw error
              }
            } else {
              const response = await github.rest.repos.listReleases({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              })
              release = response.data
                .filter(item => !item.draft)
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0]
            }

            if (!release) {
              core.setFailed('No published Release was found. Publish a Release first, then rerun the workflow.')
              return
            }

            core.info(`Uploading macOS installers to Release ${release.tag_name}`)
            core.setOutput('tag', release.tag_name)

  build-mac:
    name: Build unsigned macOS DMG (${{ matrix.arch }})
    needs: resolve-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      NODE_OPTIONS: --max-old-space-size=8192
      VITE_CLOUD_BASE_URL: ${{ secrets.VITE_CLOUD_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build renderer and main process
        run: pnpm exec vite build

      - name: Build macOS DMG
        run: pnpm exec electron-builder --mac dmg --${{ matrix.arch }} --publish never

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Reviva-macOS-${{ matrix.arch }}-dmg
          path: release/**/*.dmg
          if-no-files-found: error

      - name: Upload DMG to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-release.outputs.tag }}
          files: release/**/*.dmg

  build-windows:
    name: Build Windows x64 installer
    if: false
    runs-on: windows-latest

    env:
      NODE_OPTIONS: --max-old-space-size=8192
      VITE_CLOUD_BASE_URL: ${{ secrets.VITE_CLOUD_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build renderer and main process
        run: pnpm exec vite build

      - name: Build Windows installer
        run: pnpm exec electron-builder --win nsis --x64 --publish never

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Reviva-Windows-x64-Setup
          path: release/**/*.exe
          if-no-files-found: error

      - name: Upload Windows installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/**/*.exe
