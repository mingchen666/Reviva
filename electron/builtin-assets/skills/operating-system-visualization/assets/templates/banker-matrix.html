<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Banker's Algorithm</title><style>
body{margin:0;background:#f8fafc;color:#172033;font-family:Inter,"Noto Sans SC",system-ui,sans-serif}header{padding:18px 28px 14px;background:#fff;border-bottom:1px solid #dbe2ee}h1{margin:0;font-size:22px;letter-spacing:0}header::after{content:"操作系统 · 银行家算法 · Work/Finish/安全序列";display:flex;width:max-content;max-width:100%;min-height:26px;align-items:center;margin-top:10px;padding:0 10px;border:1px solid #e2e8f0;border-radius:999px;background:#f8fafc;color:#64748b;font-size:13px}.wrap{padding:16px;display:grid;grid-template-columns:minmax(0,1fr)330px;gap:16px}.card{background:#fff;border:1px solid #dbe2ee;border-radius:8px;padding:16px;box-shadow:0 12px 28px rgba(15,23,42,.07)}.matrices{display:grid;grid-template-columns:repeat(3,minmax(220px,1fr));gap:12px;overflow:auto}.matrix{border:1px solid #dbe2ee;border-radius:8px;overflow:hidden;background:#fff}.matrix h3{margin:0;padding:10px;background:#fff7ed;color:#9a3412;font-size:14px}.row{display:grid;grid-template-columns:60px repeat(3,1fr)}.cell{min-height:38px;padding:8px;border-top:1px solid #e5e7eb;text-align:center;font-weight:800}.hot{background:#fed7aa}.ok{background:#dcfce7}.controls{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}button{height:36px;min-width:72px;border:1px solid #dbe2ee;background:#fff;border-radius:6px;padding:0 12px;font-weight:800;cursor:pointer;transition:background .16s ease,border-color .16s ease,transform .16s ease}button:hover{background:#f8fafc;border-color:#cbd5e1}button:active{transform:translateY(1px)}button:focus-visible{outline:3px solid rgba(234,88,12,.22);outline-offset:2px}.primary{background:#ea580c;color:#fff}.note{font-size:14px;line-height:1.65;color:#334155}.mono{margin-top:12px;padding:12px;background:#0f172a;color:#e2e8f0;border-radius:6px;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap}.mono::before{content:"安全性检查";display:block;margin-bottom:6px;color:#fed7aa;font-weight:800}@media(max-width:980px){header{padding:16px}.wrap{grid-template-columns:1fr;padding:12px}.matrices{grid-template-columns:1fr;overflow:visible}}
</style></head><body><header><h1>银行家算法矩阵可视化模板</h1></header><div class="wrap"><section class="card"><div id="matrices" class="matrices"></div><div class="controls"><button id="prev">上一步</button><button id="play" class="primary">播放</button><button id="next">下一步</button><button id="reset">重置</button></div></section><aside class="card"><h2 id="title"></h2><div id="note" class="note"></div><pre id="calc" class="mono"></pre></aside></div><script>
const DATA={resources:["A","B","C"],allocation:[[0,1,0],[2,0,0],[3,0,2]],max:[[7,5,3],[3,2,2],[9,0,2]],available:[[3,3,2],[5,3,2],[7,4,3]],steps:[
{p:1,title:"检查 P1",work:[3,3,2],finish:[false,false,false],note:"Need(P1) <= Work，P1 可以完成。",safe:"P1"},
{p:0,title:"释放 P1 资源后检查 P0",work:[5,3,2],finish:[false,true,false],note:"P1 完成释放 Allocation(P1)，Work 增加。",safe:"P1 -> P0"},
{p:2,title:"继续检查 P2",work:[7,4,3],finish:[true,true,false],note:"如果 Need(P2) <= Work，则系统安全。",safe:"P1 -> P0 -> P2"}
]}
let step=0,timer=null;const $=id=>document.getElementById(id);const need=DATA.max.map((r,i)=>r.map((v,j)=>v-DATA.allocation[i][j]))
function matrix(name,data,hotP){let html=`<div class="matrix"><h3>${name}</h3><div class="row"><div class="cell">P</div>${DATA.resources.map(r=>`<div class="cell">${r}</div>`).join("")}</div>`;data.forEach((r,i)=>{html+=`<div class="row ${i===hotP?'hot':''}"><div class="cell">P${i}</div>${r.map(v=>`<div class="cell">${v}</div>`).join("")}</div>`});return html+"</div>"}
function render(){const s=DATA.steps[step];$("matrices").innerHTML=matrix("Allocation",DATA.allocation,s.p)+matrix("Max",DATA.max,s.p)+matrix("Need",need,s.p);$("title").textContent=`STEP ${step+1}: ${s.title}`;$("note").textContent=s.note;$("calc").textContent=`Work=${s.work.join(", ")}\nFinish=${s.finish.map(Boolean).join(", ")}\n当前安全序列: ${s.safe}\n考试写法: 写 Work/Finish，每轮说明 Need <= Work。`}
function stop(){clearInterval(timer);timer=null;$("play").textContent="播放"}
function next(){step=Math.min(DATA.steps.length-1,step+1);render();if(step===DATA.steps.length-1)stop()}
$("next").onclick=next;$("prev").onclick=()=>{step=Math.max(0,step-1);render()};$("reset").onclick=()=>{stop();step=0;render()};$("play").onclick=()=>{if(timer)return stop();$("play").textContent="暂停";timer=setInterval(next,900)};
render()
</script></body></html>
