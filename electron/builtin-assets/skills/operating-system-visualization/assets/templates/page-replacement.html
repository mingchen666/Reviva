<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Page Replacement</title><style>
body{margin:0;background:#f8fafc;color:#172033;font-family:Inter,"Noto Sans SC",system-ui,sans-serif}header{padding:18px 28px 14px;background:#fff;border-bottom:1px solid #dbe2ee}h1{margin:0;font-size:22px;letter-spacing:0}header::after{content:"操作系统 · 页面置换 · 页框表/缺页统计";display:flex;width:max-content;max-width:100%;min-height:26px;align-items:center;margin-top:10px;padding:0 10px;border:1px solid #e2e8f0;border-radius:999px;background:#f8fafc;color:#64748b;font-size:13px}.wrap{padding:16px;display:grid;grid-template-columns:minmax(0,1fr)330px;gap:16px}.card{background:#fff;border:1px solid #dbe2ee;border-radius:8px;padding:16px;box-shadow:0 12px 28px rgba(15,23,42,.07)}.grid{display:grid;gap:6px;overflow:auto}.cell{min-height:38px;border:1px solid #dbe2ee;border-radius:6px;display:grid;place-items:center;font-weight:800;padding:6px;text-align:center}.head{background:#f8fafc;color:#64748b}.fault{background:#fee2e2;color:#991b1b}.hit{background:#dcfce7;color:#166534}.active{outline:3px solid rgba(234,88,12,.35);outline-offset:1px}.controls{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}button{height:36px;min-width:72px;border:1px solid #dbe2ee;background:#fff;border-radius:6px;padding:0 12px;font-weight:800;cursor:pointer;transition:background .16s ease,border-color .16s ease,transform .16s ease}button:hover{background:#f8fafc;border-color:#cbd5e1}button:active{transform:translateY(1px)}button:focus-visible{outline:3px solid rgba(234,88,12,.22);outline-offset:2px}.primary{background:#ea580c;color:#fff}.note{font-size:14px;line-height:1.65;color:#334155}.mono{margin-top:12px;padding:12px;background:#0f172a;color:#e2e8f0;border-radius:6px;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap}.mono::before{content:"过程记录";display:block;margin-bottom:6px;color:#fed7aa;font-weight:800}@media(max-width:900px){header{padding:16px}.wrap{grid-template-columns:1fr;padding:12px}.grid{min-width:560px}}
</style></head><body><header><h1>页面置换可视化模板</h1></header><div class="wrap"><section class="card"><div id="grid" class="grid"></div><div class="controls"><button id="prev">上一步</button><button id="play" class="primary">播放</button><button id="next">下一步</button><button id="reset">重置</button></div></section><aside class="card"><h2 id="title"></h2><div id="note" class="note"></div><pre id="calc" class="mono"></pre></aside></div><script>
const DATA={algo:"LRU",refs:[7,0,1,2,0,3,0,4],frames:3,states:[
{ref:7,frames:[7,"",""],fault:true,note:"空页框装入 7",why:"fault=1"},
{ref:0,frames:[7,0,""],fault:true,note:"空页框装入 0",why:"fault=2"},
{ref:1,frames:[7,0,1],fault:true,note:"空页框装入 1",why:"fault=3"},
{ref:2,frames:[2,0,1],fault:true,note:"淘汰最久未用 7",why:"fault=4"},
{ref:0,frames:[2,0,1],fault:false,note:"0 已在页框中，命中",why:"fault=4"},
{ref:3,frames:[2,0,3],fault:true,note:"淘汰最久未用 1",why:"fault=5"},
{ref:0,frames:[2,0,3],fault:false,note:"0 命中",why:"fault=5"},
{ref:4,frames:[4,0,3],fault:true,note:"淘汰最久未用 2",why:"fault=6"}
]}
let step=0,timer=null;const $=id=>document.getElementById(id);function cell(t,c=""){return `<div class="cell ${c}">${t}</div>`}
function render(){let cols=DATA.refs.length+1; $("grid").style.gridTemplateColumns=`90px repeat(${DATA.refs.length}, minmax(46px,1fr))`;let html=cell("引用串","head")+DATA.refs.map((r,i)=>cell(r,i===step?"active head":"head")).join("");for(let f=0;f<DATA.frames;f++){html+=cell(`页框 ${f+1}`,"head");for(let c=0;c<DATA.refs.length;c++){html+=cell(DATA.states[c]?.frames[f]??"",c===step?"active":"")}}html+=cell("结果","head")+DATA.states.map((s,i)=>cell(s.fault?"缺页":"命中",`${s.fault?"fault":"hit"} ${i===step?"active":""}`)).join("");$("grid").innerHTML=html;const s=DATA.states[step];$("title").textContent=`STEP ${step+1}: 访问 ${s.ref}`;$("note").textContent=s.note;$("calc").textContent=`算法: ${DATA.algo}\n${s.why}\n考试写法: 写引用串、页框状态、缺页标记和淘汰原因。`}
function stop(){clearInterval(timer);timer=null;$("play").textContent="播放"}
function next(){step=Math.min(DATA.states.length-1,step+1);render();if(step===DATA.states.length-1)stop()}
$("next").onclick=next;$("prev").onclick=()=>{step=Math.max(0,step-1);render()};$("reset").onclick=()=>{stop();step=0;render()};$("play").onclick=()=>{if(timer)return stop();$("play").textContent="暂停";timer=setInterval(next,900)};
render()
</script></body></html>
