<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Operating System Visualizer</title>
  <style>
    :root { --bg:#f8fafc; --panel:#fff; --ink:#172033; --muted:#64748b; --line:#dbe2ee; --brand:#ea580c; --ok:#16a34a; --bad:#dc2626; --wait:#f59e0b; --shadow:0 12px 28px rgba(15,23,42,.07); }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:Inter, "Noto Sans SC", system-ui, sans-serif; }
    header { padding:18px 28px 14px; background:#fff; border-bottom:1px solid var(--line); }
    h1 { margin:0; font-size:22px; letter-spacing:0; }
    .meta { margin-top:10px; color:var(--muted); font-size:13px; display:flex; gap:8px; flex-wrap:wrap; }
    .meta span { min-height:26px; display:inline-flex; align-items:center; border:1px solid #e2e8f0; border-radius:999px; padding:0 10px; background:#f8fafc; }
    main { padding:16px; display:grid; grid-template-columns:minmax(0, 1fr) 350px; gap:16px; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; box-shadow:var(--shadow); }
    .stage { padding:16px; display:grid; grid-template-rows:auto 1fr auto; gap:14px; min-height:520px; }
    .queues { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
    .queue { border:1px solid #e2e8f0; border-radius:8px; padding:12px; min-height:130px; background:#fbfdff; }
    .queue h3 { margin:0 0 10px; font-size:13px; color:var(--muted); }
    .proc { display:inline-grid; place-items:center; min-width:44px; height:34px; margin:4px; border-radius:6px; font-weight:900; background:#fed7aa; border:1px solid #fb923c; }
    .proc.run { background:#bbf7d0; border-color:#22c55e; }
    .proc.wait { background:#fde68a; border-color:#f59e0b; }
    .gantt { min-height:112px; border:1px solid #e2e8f0; border-radius:8px; padding:12px; background:#fff7ed; }
    .bar { display:inline-flex; align-items:center; justify-content:center; height:38px; min-width:58px; border-right:1px solid #fff; background:#fdba74; font-weight:900; }
    .bar.active { background:#22c55e; color:#fff; }
    .controls { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    button { height:36px; min-width:72px; border:1px solid var(--line); background:#fff; border-radius:6px; padding:0 12px; font-weight:800; cursor:pointer; transition:background .16s ease, border-color .16s ease, transform .16s ease; }
    button:hover { background:#f8fafc; border-color:#cbd5e1; }
    button:active { transform:translateY(1px); }
    button:focus-visible { outline:3px solid rgba(234,88,12,.22); outline-offset:2px; }
    button.primary { color:#fff; border-color:var(--brand); background:var(--brand); }
    aside { padding:16px; display:flex; flex-direction:column; gap:14px; }
    .kicker { color:var(--brand); font-size:12px; font-weight:900; }
    .title { font-size:18px; font-weight:900; margin-top:4px; }
    .text { color:#334155; font-size:14px; line-height:1.65; }
    .matrix { margin:0; padding:12px; border-radius:6px; background:#0f172a; color:#e2e8f0; font:12px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space:pre-wrap; }
    footer { padding:0 16px 16px; }
    .table-wrap { padding:14px; overflow:auto; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th,td { border-bottom:1px solid var(--line); padding:8px 10px; text-align:left; }
    th { color:var(--muted); font-size:12px; }
    tbody tr:nth-child(even) { background:#f8fafc; }
    .note { margin-top:12px; background:#fff7ed; border-left:4px solid var(--brand); padding:12px; font-size:13px; line-height:1.6; }
    @media (max-width: 980px) { header { padding:16px; } main { grid-template-columns:1fr; padding:12px; } .queues { grid-template-columns:1fr; } .stage { min-height:auto; } }
  </style>
</head>
<body>
  <header>
    <h1 id="title">操作系统可视化模板</h1>
    <div class="meta"><span id="topic">CPU 调度 / 页面置换 / 死锁矩阵可改造</span><span>单文件 HTML</span></div>
  </header>
  <main>
    <section class="card stage">
      <div class="queues">
        <div class="queue"><h3>就绪队列</h3><div id="ready"></div></div>
        <div class="queue"><h3>运行</h3><div id="running"></div></div>
        <div class="queue"><h3>等待/完成</h3><div id="done"></div></div>
      </div>
      <div class="gantt" id="gantt"></div>
      <div class="controls"><button id="prev">上一步</button><button id="play" class="primary">播放</button><button id="next">下一步</button><button id="reset">重置</button></div>
    </section>
    <aside class="card">
      <div><div class="kicker" id="stepNo">STEP 1</div><div class="title" id="stepTitle">初始化</div><div class="text" id="stepText"></div></div>
      <pre class="matrix" id="calc"></pre>
    </aside>
  </main>
  <footer>
    <section class="card table-wrap">
      <table><thead><tr><th>时间</th><th>事件</th><th>队列/表格状态</th><th>考试书写点</th></tr></thead><tbody id="rows"></tbody></table>
      <div class="note">考试迁移：OS 可视化必须同步展示队列/矩阵/页框表和计算公式，最后给等待时间、周转时间、缺页次数或安全序列等可评分结论。</div>
    </section>
  </footer>
  <script>
    const DATA = {
      title: "Round Robin 调度示例",
      steps: [
        { t:0, title:"初始化", ready:["P1","P2","P3"], run:null, done:[], gantt:[], text:"时间片 q=2，所有进程进入就绪队列。", calc:"P1: burst=5\nP2: burst=3\nP3: burst=2", exam:"写出初始队列和时间片" },
        { t:0, title:"P1 运行", ready:["P2","P3"], run:"P1", done:[], gantt:["P1"], text:"P1 获得 CPU，运行一个时间片。", calc:"P1 剩余 3", exam:"记录 0-2: P1" },
        { t:2, title:"P2 运行", ready:["P3","P1"], run:"P2", done:[], gantt:["P1","P2"], text:"P1 未完成回到队尾，P2 运行。", calc:"P2 剩余 1", exam:"未完成进程回队尾" },
        { t:4, title:"P3 完成", ready:["P1","P2"], run:"P3", done:["P3"], gantt:["P1","P2","P3"], text:"P3 运行 2 单位后完成。", calc:"P3 完成时间 = 6", exam:"完成进程离开队列" },
        { t:6, title:"继续轮转", ready:["P2"], run:"P1", done:["P3"], gantt:["P1","P2","P3","P1"], text:"P1 再运行一个时间片。", calc:"P1 剩余 1", exam:"继续按队列顺序轮转" }
      ]
    }
    let i = 0, timer = null
    const $ = id => document.getElementById(id)
    const chip = (p, cls="") => p ? `<span class="proc ${cls}">${p}</span>` : ""
    function render() {
      const s = DATA.steps[i]
      $("title").textContent = DATA.title
      $("stepNo").textContent = `STEP ${i + 1} / ${DATA.steps.length}`
      $("stepTitle").textContent = `${s.title} (t=${s.t})`
      $("stepText").textContent = s.text
      $("ready").innerHTML = s.ready.map(p => chip(p)).join("")
      $("running").innerHTML = chip(s.run, "run")
      $("done").innerHTML = s.done.map(p => chip(p, "wait")).join("")
      $("gantt").innerHTML = s.gantt.map((p, idx) => `<span class="bar ${idx===s.gantt.length-1?'active':''}">${p}</span>`).join("")
      $("calc").textContent = s.calc
      $("rows").innerHTML = DATA.steps.map(row => `<tr><td>${row.t}</td><td>${row.title}</td><td>${[...row.ready, row.run || "-", ...row.done].join(" | ")}</td><td>${row.exam}</td></tr>`).join("")
    }
    function next(){ i = Math.min(DATA.steps.length - 1, i + 1); render(); if(i === DATA.steps.length - 1) stop() }
    function prev(){ i = Math.max(0, i - 1); render() }
    function stop(){ clearInterval(timer); timer = null; $("play").textContent = "播放" }
    $("next").onclick = next; $("prev").onclick = prev; $("reset").onclick = () => { stop(); i = 0; render() }
    $("play").onclick = () => { if(timer) return stop(); $("play").textContent = "暂停"; timer = setInterval(next, 900) }
    render()
  </script>
</body>
</html>
