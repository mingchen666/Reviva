<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Pipeline Grid</title><style>
body{margin:0;background:#f6f7fb;color:#111827;font-family:Inter,"Noto Sans SC",system-ui,sans-serif}header{padding:18px 28px 14px;background:#fff;border-bottom:1px solid #dbe2ee}h1{margin:0;font-size:22px;letter-spacing:0}header::after{content:"组成原理 · 流水线 · hazard/stall/转发分析";display:flex;width:max-content;max-width:100%;min-height:26px;align-items:center;margin-top:10px;padding:0 10px;border:1px solid #e2e8f0;border-radius:999px;background:#f8fafc;color:#64748b;font-size:13px}.wrap{padding:16px;display:grid;grid-template-columns:minmax(0,1fr)330px;gap:16px}.card{background:#fff;border:1px solid #dbe2ee;border-radius:8px;padding:16px;box-shadow:0 12px 28px rgba(15,23,42,.07)}.grid{display:grid;grid-template-columns:140px repeat(8,minmax(56px,1fr));gap:6px;overflow:auto}.cell{min-height:42px;border:1px solid #dbe2ee;border-radius:6px;display:grid;place-items:center;font-weight:800;background:#fff;text-align:center;padding:6px}.head{background:#f8fafc;color:#64748b}.if{background:#dbeafe}.id{background:#ede9fe}.ex{background:#fef3c7}.mem{background:#dcfce7}.wb{background:#fee2e2}.stall{background:#fecaca;color:#991b1b}.active{outline:3px solid rgba(79,70,229,.35);outline-offset:1px}.controls{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}button{height:36px;min-width:72px;border:1px solid #dbe2ee;background:#fff;border-radius:6px;padding:0 12px;font-weight:800;cursor:pointer;transition:background .16s ease,border-color .16s ease,transform .16s ease}button:hover{background:#f8fafc;border-color:#cbd5e1}button:active{transform:translateY(1px)}button:focus-visible{outline:3px solid rgba(79,70,229,.22);outline-offset:2px}.primary{background:#4f46e5;color:#fff}.note{font-size:14px;line-height:1.65;color:#334155}.mono{margin-top:12px;padding:12px;background:#0f172a;color:#e2e8f0;border-radius:6px;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap}.mono::before{content:"判题依据";display:block;margin-bottom:6px;color:#c4b5fd;font-weight:800}@media(max-width:900px){header{padding:16px}.wrap{grid-template-columns:1fr;padding:12px}.grid{grid-template-columns:132px repeat(8,64px)}}
</style></head><body><header><h1>流水线时序可视化模板</h1></header><div class="wrap"><section class="card"><div id="grid" class="grid"></div><div class="controls"><button id="prev">上一步</button><button id="play" class="primary">播放</button><button id="next">下一步</button><button id="reset">重置</button></div></section><aside class="card"><h2 id="title"></h2><div id="note" class="note"></div><pre id="calc" class="mono"></pre></aside></div><script>
const STAGES=["IF","ID","EX","MEM","WB"], DATA={inst:["I1: LD R1,0(R2)","I2: ADD R3,R1,R4","I3: SUB R5,R6,R7"],steps:[
{title:"理想进入流水线",active:[0,0],note:"I1 进入 IF。",calc:"周期表从 IF 开始填写。"},
{title:"数据相关出现",active:[1,2],note:"I2 需要 I1 写回的 R1，若无转发会 stall。",calc:"RAW hazard: I1 -> I2 on R1"},
{title:"插入停顿",active:[1,3],stall:true,note:"I2 在 ID/EX 前等待，流水线产生气泡。",calc:"考试写法: 标出 stall，并重新计算总周期。"},
{title:"继续执行",active:[2,3],note:"相关解除后继续推进。",calc:"总周期 = 理想周期 + stall 数"}
]}
let step=0,timer=null; const $=id=>document.getElementById(id)
function cell(txt,cls=""){return `<div class="cell ${cls}">${txt||""}</div>`}
function render(){const s=DATA.steps[step];let html=cell("指令/周期","head");for(let c=1;c<=8;c++)html+=cell(c,"head");DATA.inst.forEach((ins,r)=>{html+=cell(ins,"head");for(let c=1;c<=8;c++){let stage="";const offset=c-r-1;if(offset>=0&&offset<5)stage=STAGES[offset];let cls=stage.toLowerCase();if(s.stall&&r===1&&c===4){stage="STALL";cls="stall"}if(s.active&&s.active[0]===r&&s.active[1]===c-1)cls+=" active";html+=cell(stage,cls)}});$("grid").innerHTML=html;$("title").textContent=`STEP ${step+1}: ${s.title}`;$("note").textContent=s.note;$("calc").textContent=s.calc}
function stop(){clearInterval(timer);timer=null;$("play").textContent="播放"}
function next(){step=Math.min(DATA.steps.length-1,step+1);render();if(step===DATA.steps.length-1)stop()}
$("next").onclick=next;$("prev").onclick=()=>{step=Math.max(0,step-1);render()};$("reset").onclick=()=>{stop();step=0;render()};$("play").onclick=()=>{if(timer)return stop();$("play").textContent="暂停";timer=setInterval(next,900)};render()
</script></body></html>
